<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 8)">
    <!-- Shield/Circle Base -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#gradPrimary)" />
    <!-- Sun -->
    <circle cx="32" cy="24" r="11" fill="url(#gradSun)" />
    <!-- Mountain/Wave Layers -->
    <path d="M12 50 C 22 36, 32 38, 42 46 C 46 49, 50 51, 52 50 L 52 54 C 52 57, 49 60, 46 60 L 18 60 C 14 60, 12 57, 12 54 Z" fill="#0284C7" opacity="0.6"/>
    <path d="M12 55 C 20 45, 36 44, 52 55 L 52 56 C 52 58.5, 49.5 60.5, 47 60.5 L 17 60.5 C 14.5 60.5, 12 58.5, 12 56 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Compass / Airplane Accent -->
    <path d="M32 14 L 35 25 L 43 23 L 36 29 L 41 37 L 32 31 L 23 37 L 28 29 L 21 23 L 29 25 Z" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="32" cy="24" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 12)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="26" letter-spacing="1.5" fill="#0F172A">
      NIRWANA<tspan fill="#0284C7">TOUR</tspan>
    </text>
    <text x="1" y="52" font-family="'Plus Jakarta Sans', 'Poppins', 'Segoe UI', sans-serif" font-weight="600" font-size="11" letter-spacing="4" fill="#64748B">
      LAMPUNG &bull; INDONESIA
    </text>
  </g>
</svg>
